# OpenOCD configuration for BBC micro:bit v2 with RTT support
# Exposes SystemView RTT Channel 1 on TCP port 5000
source [find interface/cmsis-dap.cfg]
source [find target/nrf52.cfg]

# Increase adapter speed for better performance
adapter speed 10000

init

# RTT Configuration
rtt setup 0x20000000 0x40000 "SEGGER RTT"
rtt start

# Start RTT server on port 5000 for channel 1 (SystemView)
rtt server start 5000 1

# Firmware text logs use the board's USB UART, not an RTT log channel.

reset init
