# Debug and tracing configuration
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

# SEGGER SystemView support
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_SEGGER_SYSTEMVIEW_BOOT_ENABLE=y
CONFIG_SEGGER_SYSVIEW_RTT_CHANNEL=1
CONFIG_SEGGER_SYSVIEW_RTT_BUFFER_SIZE=32192
CONFIG_USE_SEGGER_RTT=y
CONFIG_TRACING=y
CONFIG_THREAD_NAME=y
# ADDED Extra
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y

# Firmware text/log output goes to USB UART; SystemView traces stay on RTT channel 1
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n

# GPIO for button and LED
CONFIG_GPIO=y

# System workqueue configuration
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable fault handling
CONFIG_FAULT_DUMP=2

# Main stack size
CONFIG_MAIN_STACK_SIZE=2048

# Kernel options for better tracing
CONFIG_THREAD_STACK_INFO=y
CONFIG_TIMESLICING=n